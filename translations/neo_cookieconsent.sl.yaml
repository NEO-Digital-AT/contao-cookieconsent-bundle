text.banner_title: "Piškotki in storitve"
text.banner_text: "Uporabljamo nujne piškotke, da to spletno mesto deluje. Z vašim soglasjem uporabljamo tudi: {services}. {transfer} Vaše soglasje je prostovoljno; kadar koli ga lahko spremenite ali prekličete v nastavitvah piškotkov."
text.settings_title: "Nastavitve piškotkov"
text.settings_text: "Izberite, katere storitve dovolite. Nujni piškotki so vedno aktivni. Svojo izbiro lahko kadar koli spremenite."
